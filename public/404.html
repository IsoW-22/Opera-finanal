<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>OPÉRA — Redirecting…</title>
    <script>
      // GitHub Pages has no SPA rewrites, so deep links such as
      // /opera-finanal/about land here. Encode the requested path into the
      // query and hand it to the app, which restores it with history.replaceState.
      ;(function (location) {
        var segmentsToKeep = 1 // repo name: '/opera-finanal' (0 for a user/organisation site)
        location.replace(
          location.protocol +
            '//' +
            location.hostname +
            (location.port ? ':' + location.port : '') +
            location.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') +
            '/?/' +
            location.pathname
              .slice(1)
              .split('/')
              .slice(segmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '') +
            location.hash,
        )
      })(window.location)
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
